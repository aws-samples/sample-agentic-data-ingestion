[project]
name = "awslabs.aws-dataprocessing-mcp-server"
version = "0.1.0"
description = "An AWS Labs Model Context Protocol (MCP) server for data processing - AgentCore Compatible"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
    "anyio>=4.0.0",
    "typing-extensions>=4.0.0",
]
license = {text = "Apache-2.0"}
authors = [
    {name = "Amazon Web Services"},
    {name = "AgenticDataIngestion Project"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
"awslabs.aws-dataprocessing-mcp-server" = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awslabs"]