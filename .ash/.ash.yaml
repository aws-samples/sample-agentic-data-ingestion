      path: "dashboard-react/src/*__tests__/*.prop*.test.ts*"
      reason: >-
        fast-check property tests build identifiers from a literal alphabet
        ('abcdefghijklmnopqrstuvwxyz0123456789_' and similar). A string
        containing every letter is maximally "high entropy" and contains no
        secret.

