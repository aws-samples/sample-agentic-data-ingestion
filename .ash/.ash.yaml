# ASH (Automated Security Helper) configuration.
#
# Every suppression below is path-scoped and carries a reason. Nothing is
# suppressed globally, and nothing is suppressed that was not individually
# inspected — a finding we cannot justify in writing is a real finding and is
# left to fail.
#
# ACCEPTED by the owner on 2026-10-07 and suppressed below with an expiration
# of 2027-01-07, so each one resurfaces in three months for a fresh look.
# Before that date they were deliberately left failing until a reviewer
# accepted them; that acceptance is now recorded here, in the scan TRIAGE.md
# and in the threat model (internal-docs/security/threat-model.md, Appendix D).
# Each suppression names the exact rule id and file, so a NEW advisory on the
# same package, or the same rule anywhere else, still fires.
#   * grype on deploy-cdk/glue-jars/s3-tables-catalog-for-iceberg-runtime-0.1.5.jar
#     — Apache Commons DoS advisories in classes the shaded JAR bundles. The
#     newest release (0.1.8) bundles the same commons versions, so upgrading
#     does not clear them. The JAR runs inside the Glue job, on the pipeline's
#     own data.
#   * semgrep/opengrep npm-missing-minimum-release-age on the two .npmrc files.
#     The `min-release-age` setting needs npm 11.10 or later; the toolchain is
#     npm 10, which warns on the unknown key on every command.
#   * bandit B701 jinja2_autoescape_false at the five Environment() calls that
#     render PySpark source and plain-text prompts (see the B701 note below).
# What to do when one resurfaces: check whether a fix has shipped (a catalog
# JAR with patched commons, npm 11.10 in the toolchain). If not, re-accept with
# a new date; do not drop the expiration.
#
# Formerly on this list and now FIXED, so they should no longer fire:
#   * npm-audit / grype: react-router 6, GHSA-wrjc-x8rr-h8h6 (open redirect via
#     a backslash in <Link>/useNavigate) and GHSA-337j-9hxr-rhxg (SSR
#     hydration). Fixed 2026-10-11 by moving the dashboard to react-router-dom
#     7.18.4; `npm audit --omit=dev` in dashboard-react reports 0.
#   * npm-audit / grype: brace-expansion bundled inside aws-cdk-lib,
#     GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr and GHSA-qhr7-859c-m2p7. Fixed
#     2026-10-11 by aws-cdk-lib 2.273.0, which bundles brace-expansion 5.0.12;
#     `npm audit --omit=dev` in deploy-cdk reports 0.
#   * CKV_DOCKER_3 (container runs as root). All nine agentcore/*/Dockerfile
#     images now declare `USER agentuser`. If ASH reports it again, a
#     Dockerfile has regressed — that is a real finding, not stale config.
#
# Formerly on this list and now AUDITED, then suppressed inline rather than
# here, so the exemption covers the six audited lines and nothing else:
#   * B608 hardcoded_sql_expressions — Athena SQL assembled by f-string in the
#     data-quality agent (agentcore/data_quality_agent/main.py), at six sites
#     in check_row_count, check_null_rates, check_duplicates and
#     check_freshness. Each function passes every table and column name it
#     interpolates through validate_identifier() (shared/identifier_utils.py:
#     a full match against ^[A-Za-z_][A-Za-z0-9_]*$, at most 255 characters)
#     before building the string. The database name is sent as
#     QueryExecutionContext and never interpolated, and the information_schema
#     lookup binds its values through ExecutionParameters. The audit found no
#     other SQL under agentcore/. The rejection of hostile identifiers is
#     pinned by
#     tests/unit/agents/data_quality_agent/test_athena_identifier_validation.py.
#     Each site carries `# noqa: S608  # nosec B608` on the line the scanners
#     report, so a new f-string SQL site anywhere still fails. `make security`
#     now scans agentcore/ as well as lambda/, shared/ and mcp/.
#
# B701 jinja2_autoescape_false, at the PySpark template environment
# (lambda/agentic_data_ingestion_create_code/code_assembly.py), the prompt
# template loader (shared/prompt_template_loader.py) and the golden-script
# helpers in scripts/, is a false positive by construction: those templates
# render Python source and plain-text LLM prompts, never HTML, so HTML
# autoescaping would corrupt their output. Accepted 2026-10-07 and suppressed
# by line below, with an expiration. `make security` (bandit run directly, not
# through ASH) still reports them, which is intended: that target reads no
# ASH config.
#
# Re-run ASH after touching this file. Scanners lint their own config.

global_settings:
  severity_threshold: MEDIUM

  suppressions:

    # ---- detect-secrets -----------------------------------------------------

    - rule_id: SECRET-AWS-ACCESS-KEY
      path: "tests/contracts/api_responses/test_presign_contract.py"
      reason: >-
        AKIAIOSFODNN7EXAMPLE, the access key ID published in AWS's own
        documentation as the canonical example value. Not a credential, and it
        cannot authenticate. Used here because the presigned-POST contract test
        needs a well-formed key ID in the policy it asserts on.

    - rule_id: SECRET-AWS-ACCESS-KEY
      path: "tests/unit/lambdas/dashboard_api/test_presign_upload.py"
      reason: >-
        Same AWS documentation example key ID as above, for the same reason —
        the upload handler's presign response is asserted field by field.

    # REMOVED (p68): a suppression for docs/archive/prompts/glue_code_analysis_prompt.md.
    # That path no longer exists under this prefix — docs/archive/ was relocated to
    # internal-docs/archive/, outside the publishable project, so the file it
    # suppressed is no longer scanned. A suppression naming a path that cannot be
    # reached reads as a live exemption and hides nothing, so it is deleted rather
    # than repointed.

    - rule_id: SECRET-BASIC-AUTH-CREDENTIALS
      path: "dashboard-react/src/pages/wizard/__tests__/WizardStepReview.test.tsx"
      reason: >-
        Synthetic JDBC URLs ("user:secret@host", "admin:p%40ss@host") passed as
        INPUT to maskJdbcUrl(). The test asserts the credentials are stripped
        before display, so removing them would delete the coverage that proves
        credentials are masked.

    - rule_id: SECRET-TELEGRAM-BOT-TOKEN
      path: "tests/fixtures/events/sqs_message_envelope.json"
      reason: >-
        False positive on an SQS `md5OfBody` field. The value is
        d41d8cd98f00b204e9800998ecf8427e, the MD5 of the empty string, which is
        a fixed public constant and structurally resembles a bot token.

    - rule_id: CKV_SECRET_6
      path: "tests/fixtures/events/sfn_task_token.json"
      reason: >-
        Synthetic AWS Step Functions task token, a short repeating pattern
        rather than a captured value. Task tokens are single-execution and this
        one refers to no execution that has ever existed.

    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      path: "tests/fixtures/*"
      reason: >-
        Synthetic identifiers in offline test fixtures — run ids, pipeline ids,
        execution ids, trace and span ids. High entropy is what makes them
        realistic ids; none is a credential and none grants access to anything.

    # REMOVED (2026-10-06): SECRET-BASE64-HIGH-ENTROPY-STRING on "tests/fixtures/*".
    # The 2026-10-02 scan's unused-suppressions report showed it matched nothing:
    # no base64-shaped finding exists under tests/fixtures/. A suppression that
    # matches nothing hides nothing today and would silently hide a real one
    # tomorrow, so it is deleted rather than kept "just in case".

    - rule_id: SECRET-SECRET-KEYWORD
      path: "tests/*"
      reason: >-
        Matches on the words "secret"/"token" in test code that exercises
        Secrets Manager ARN handling and Step Functions task tokens. The
        project's standing rule is that credentials are referenced by ARN and
        never held in plaintext, so these are ARNs and identifiers, not values.

    # ---- detect-secrets: triage of the 2026-10-02 scan ----------------------
    #
    # 52 detect-secrets findings were inspected one by one; all are false
    # positives. One (skills-lock.json) was removed from the tree instead. The
    # rest are suppressed below, by line wherever the finding is a single
    # literal, so a new string elsewhere in the same file still fires. Two
    # entries use a file glob because the finding is a pattern repeated across
    # many files (character alphabets in property tests, and keyword matches
    # in frontend tests mirroring the Python "tests/*" entry above). Line
    # numbers are as of 2026-10-06; re-check the unused-suppressions report
    # after editing any file named here.

    - rule_id: SECRET-SECRET-KEYWORD
      path: "dashboard-react/src/*__tests__/*"
      reason: >-
        The frontend twin of the "tests/*" entry above. Every match is a
        synthetic Secrets Manager ARN (secret_arn: 'arn:aws:secretsmanager:...')
        passed through wizard and hook tests, or the fixed string "hunter2" in
        api-error.test.ts, which that test feeds in to prove error details are
        redacted before display.

    - rule_id: SECRET-SECRET-KEYWORD
      path: "deploy-cdk/test/*"
      reason: >-
        CDK assertion tests. foundation-iam.test.ts names the Secrets Manager
