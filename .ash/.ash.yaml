    # ---- bandit -------------------------------------------------------------

    - rule_id: B101
      path: "tests/*"
      reason: >-
        assert_used. These are pytest assertions, which is what a test is made
        of. Accounts for the overwhelming majority of low-severity findings.

    - rule_id: B102
      path: "tests/*"
      reason: >-
        exec_used. Test-only: several suites AST-load a Lambda handler and exec
        it to characterise behaviour without importing the deployment package.
        Verified that no exec() call exists anywhere under lambda/, shared/,
        mcp/ or agentcore/.

    - rule_id: B307
      path: "tests/*"
      reason: >-
        eval_used. Three occurrences, all test helpers that evaluate a
        transcribed call-site expression to pin current behaviour. Verified
        that production code contains zero eval() — a property the threat model
        depends on and states explicitly.

    # REMOVED (2026-10-06): B701 on "pyspark_templates/*". Bandit reports
    # B701 where a jinja2.Environment is constructed, which is Python code
    # (code_assembly.py, prompt_template_loader.py), never inside a .j2 file,
    # so this entry matched nothing (2026-10-02 unused-suppressions report).
    # It is deleted rather than repointed at code_assembly.py: the header
    # records that the production B701 findings stay visible on purpose.

    - rule_id: B701
      path: "tests/*"
      reason: >-
        Same autoescape=False setting, in the tests that render those templates.
        The test environment has to match the production one or it proves
        nothing.

    - rule_id: B104
      path: "mcp/*"
      reason: >-
        hardcoded_bind_all_interfaces. The MCP servers bind 0.0.0.0:8080 because
        they run as containers, where binding the loopback interface would make
        the port unreachable from outside the container. Network exposure is
        controlled by the task's security group and by AgentCore, not by the
        bind address.

